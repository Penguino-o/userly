plugins {
    id 'com.android.application'
}

def signingPropsFile = rootProject.file('keystore.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {
    namespace 'gg.userly.app'
    compileSdk 34

    defaultConfig {
        applicationId "gg.userly.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(signingProps.getProperty('storeFile', 'keystore/userly-release.jks'))
            storePassword signingProps.getProperty('storePassword')
            keyAlias signingProps.getProperty('keyAlias', 'userly')
            keyPassword signingProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            // uses the automatic debug signing config
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
